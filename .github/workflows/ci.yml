name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/sekaisync-*.whl
          sekaisync --no-event-check --store ./smoke-store init --demo
          sekaisync --no-event-check --store ./smoke-store lookup --query "星乃一歌" --language zh_tw
          sekaisync --no-event-check --store ./smoke-store factpack --id "demo:character:1" --language zh_tw
          sekaisync --no-event-check --store ./smoke-store status
