name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show toolchain
        run: dotnet --info

      - name: Restore
        run: dotnet restore SekaiSync.Desktop.csproj

      - name: Build
        run: dotnet build SekaiSync.Desktop.csproj -c Release -p:Platform=x64 --no-restore
